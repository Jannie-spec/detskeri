<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}} – i dag og de næste dage</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANON}}">
{{HREFLANG}}
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANON}}">
<meta property="og:locale" content="{{OGLOCALE}}">

<meta property="og:site_name" content="detskeri.dk">
<meta property="og:image" content="https://detskeri.dk/{{OGIMG}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#e5e9e1">
<link rel="icon" href="{{UP}}favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<script type="application/ld+json">{{JSONLD}}</script>
<style>
/* Det sker i … – salvie, koral og klippe-rød. Signatur: tegning af en bornholmsk kystby øverst og et kalenderblad for hver dag */
:root{
  --bg:#f3f5f0; --surface:#fff; --sage:#e5e9e1; --mist:#c8d4d0; --moss:#6f806e; --sea:#c6d8d9; --deep:#3f6670;
  --coral:#e37b5b; --brick:#b4533a; --ink:#302f2f; --muted:#5f625e; --line:#dde3d9; --sol:#f2c46b;
  --serif:"Young Serif", Georgia, serif; --sans:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--sans)}
a{color:var(--brick);text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* forside: tegning af Gudhjem */
.hero{background:var(--sage);position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1;padding-top:34px;padding-bottom:0}
.hero h1{font:400 clamp(2.6rem,10vw,4.6rem)/.95 var(--serif);margin:0;letter-spacing:-.015em;max-width:8em}
.hero p{margin:14px 0 0;max-width:30em;color:#4a4d49;font-size:1.02rem}
.by{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.toprow .by.chip{margin:0}
.langs{display:flex;gap:4px}
.langs a{font-size:.82rem;font-weight:700;text-decoration:none;color:var(--muted);padding:5px 8px;border-radius:999px}
.langs a[aria-current="true"]{background:#fff;color:var(--brick)}
.by.chip{background:#fff;border-radius:999px;padding:6px 14px 6px 10px;margin:0 0 16px;box-shadow:0 1px 0 var(--line)}
.by a{font-weight:700;text-decoration:none}
.town{display:block;width:100%;height:auto;margin-top:4px}
.town .pin{display:none}
.townkey{display:none;flex-wrap:wrap;gap:6px 14px;margin:0;padding:10px 0 14px;font-size:.88rem;font-weight:600;color:var(--ink)}
.townkey b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--brick);color:#fff;font-size:.75rem;margin-right:6px}
.hero .keywrap{padding-top:0}
.hero .townkey{margin:0}
@media (max-width:700px){.town{aspect-ratio:1010/380}}
@media (min-width:900px){.town{margin-top:-10px}}

nav.days{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.days .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.days .wrap::-webkit-scrollbar{display:none}
nav.days a{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.92rem;font-weight:500}
nav.days a.on{background:var(--brick);border-color:var(--brick);color:#fff}

/* en dag = et kalenderblad + indhold */
main{padding:22px 0 10px;display:grid;gap:22px}
.day{background:var(--surface);border-radius:22px;padding:22px 20px 18px;box-shadow:0 1px 0 var(--line)}
.dayhead{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.leaf{flex:0 0 auto;width:64px;border-radius:12px;overflow:hidden;text-align:center;background:var(--bg);border:1px solid var(--line);display:grid}
.leaf .lw{background:var(--coral);color:#fff;font-size:.78rem;font-weight:700;padding:3px 0;text-transform:capitalize}
.leaf .ln{font:400 1.9rem/1.1 var(--serif);padding-top:4px}
.leaf .lm{font-size:.78rem;color:var(--muted);padding-bottom:5px}
.day h2{margin:0;display:grid;gap:2px;font-weight:400}
.day .big{font:400 clamp(1.8rem,6vw,2.4rem)/1 var(--serif)}
.day .date{font-size:.95rem;color:var(--muted)}
.day:first-of-type .leaf .lw{background:var(--brick)}

.bird{width:34px;height:16px;fill:none;stroke:var(--brick);stroke-width:60;stroke-linejoin:round}
.times,.food ul{list-style:none;margin:0;padding:0}
/* tidslinje med ikoner */
.times li{display:grid;grid-template-columns:38px 7em 1fr;gap:2px 12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.times li:first-child{border-top:0}
.t{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;padding-top:8px;font-size:.95rem}
.klippen .t{padding-top:0}
.what{display:grid;min-width:0}
.times .what{padding-top:6px}
.what b{font-weight:600;font-size:1.02rem;line-height:1.3}
.what b a{color:var(--ink);text-decoration:none}
.what b a:hover{color:var(--brick);text-decoration:underline}
.where{color:var(--muted);font-size:.92rem}
.what small{color:var(--muted)}
.what a.reg{justify-self:start;margin-top:4px;font-size:.8rem;font-weight:700;color:var(--brick);background:color-mix(in srgb,var(--coral) 14%,transparent);border-radius:6px;padding:2px 7px;text-decoration:none}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sage);color:var(--moss)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic-film{background:#ece6f0;color:#6d5a86}
.ic-svom{background:var(--sea);color:var(--deep)}
.ic-kirke{background:#efe9df;color:#8a6d45}
.ic-musik{background:#f6e3da;color:var(--brick)}
.ic-born{background:#fbe9c9;color:#a5701c}
.ic-foredrag{background:#e4ebe9;color:var(--deep)}
.ic-kunst{background:#f3dfe0;color:#9c4a55}
.ic-mad{background:#f6e3da;color:var(--brick)}
li.past{opacity:.4}
li.now .t{color:var(--brick)}
html[lang=en] li.now .t::after{content:"now"}
html[lang=de] li.now .t::after{content:"jetzt"}
html[lang=sv] li.now .t::after{content:"nu"}
li.now .t::after{content:"nu";display:inline-block;margin-left:6px;font-size:.7rem;background:var(--sol);color:var(--ink);border-radius:999px;padding:1px 7px;vertical-align:2px}

/* åbent denne dag */
.opens{margin-top:14px}
.olabel{margin:0 0 8px;font-size:.88rem;color:var(--muted);font-weight:500}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{display:grid;padding:8px 12px;border-radius:12px;background:var(--sage);text-decoration:none;color:var(--ink);min-width:7.5em}
.tile.sea{background:var(--sea)}
.tile .tn{font-weight:600;font-size:.92rem}
.tile .th{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile:hover{outline:2px solid var(--mist)}

.food{margin-top:14px;border-top:1px dashed var(--line);padding-top:8px}
.food summary{cursor:pointer;display:flex;align-items:center;gap:12px;font-weight:600;list-style:none}
.food summary::-webkit-details-marker{display:none}
.food summary b{background:var(--brick);color:#fff;border-radius:999px;padding:0 8px;font-size:.8rem;margin-left:4px}
.food li{display:flex;justify-content:space-between;gap:12px;padding:8px 0 8px 50px;border-top:1px solid var(--line)}
.food li .t{padding-top:0;font-weight:500;color:var(--muted)}
.food .tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--brick);border-radius:4px;padding:2px 5px;margin-right:6px;vertical-align:2px}

.quiet{color:var(--muted);margin:0}
.about{padding:6px 4px 0;color:var(--muted)}
.about h2{font:400 1.5rem/1.1 var(--serif);color:var(--ink);margin:0 0 8px}
.about p{margin:0 0 10px;max-width:42em}
.about .also a{color:var(--brick)}
/* guider: menu over byerne */
.guides{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 0}
.guides a{font-size:.88rem;font-weight:600;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.7);border-radius:999px;padding:5px 12px}
.guides a[aria-current="page"]{background:var(--brick);color:#fff}
.brand{font:400 1.05rem/1 var(--serif);color:var(--ink);text-decoration:none}
.ic-teater{background:#f3dfe0;color:#9c4a55}
.ic-sport{background:#dfe9e4;color:#3f6a55}
/* filter pr. by på øsiden */
.tfilter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-4px 0 10px;padding-bottom:2px}
.tfilter::-webkit-scrollbar{display:none}
.tfilter button{flex:0 0 auto;font:inherit;font-size:.82rem;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.tfilter button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.times li.hid{display:none}
.food li.fhead{display:block;padding:12px 0 4px;border-top:0;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--brick)}
.food .unk{margin:10px 0 0;font-size:.9rem;color:var(--muted)}
.food .unk a{color:var(--ink)}
.food .fwarn{margin:10px 0 4px 50px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--sol) 30%,transparent);font-size:.88rem;color:var(--ink)}
.food .unsure{display:inline-block;font-size:.7rem;font-weight:700;color:#8a5a12;background:#fbe9c9;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
@media (max-width:520px){.food .fwarn{margin-left:0}}
.food .fnote{margin:8px 0 4px;font-size:.8rem;color:var(--muted)}

/* Længere frem: et år frem, én foldbar række pr. måned */
nav.days a.latr{background:transparent;border-style:dashed;color:var(--brick);font-weight:700}
nav.days a.latr.on{background:var(--brick);border-style:solid;color:#fff}
.later{background:var(--surface);border-radius:22px;padding:22px 20px 10px;box-shadow:0 1px 0 var(--line);scroll-margin-top:70px}
.lhead{margin:0;font:400 clamp(1.8rem,6vw,2.4rem)/1 var(--serif)}
.lsub{margin:8px 0 14px;color:var(--muted);font-size:.95rem}
.month{border-top:1px solid var(--line)}
.month summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;padding:14px 2px}
.month summary::-webkit-details-marker{display:none}
.month summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .15s}
.month[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.month .mn{font:400 1.35rem/1.1 var(--serif)}
.month .my{color:var(--muted);font-size:.9rem}
.month summary b{background:var(--sage);color:var(--ink);border-radius:999px;padding:1px 9px;font-size:.8rem}
.lrows{list-style:none;margin:0 0 10px;padding:0}
.lrows li{display:grid;grid-template-columns:4.6em 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.lrows li:first-child{border-top:0}
.ld{display:grid;align-self:start;align-content:start;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px 2px 4px;line-height:1.15}
.lwd{font-size:.72rem;font-weight:700;color:var(--brick);text-transform:capitalize}
.ldn{font:400 1.05rem/1.2 var(--serif)}
.lrows .what b .bird{width:24px;height:12px;margin-right:6px;vertical-align:0}
.lrows li.own .ld{border-color:var(--coral)}

footer{padding:26px 0 60px;display:grid;gap:22px;color:var(--muted);font-size:.95rem}
.stay{background:var(--brick);color:#fff;border-radius:22px;padding:24px;position:relative;overflow:hidden}
.stay h2{font:400 1.8rem/1.1 var(--serif);margin:0 0 8px}
.stay p{margin:0 0 16px;max-width:30em;color:#fbe7df}
.stay a.btn{display:inline-block;background:#fff;color:var(--brick);text-decoration:none;font-weight:700;padding:10px 18px;border-radius:999px}
.stay .bird{position:absolute;right:-20px;bottom:-14px;width:180px;height:82px;stroke:#ffffff;opacity:.25;stroke-width:28}
footer h3{font:700 1rem var(--sans);color:var(--ink);margin:0 0 4px}
footer p{margin:0}
.small{font-size:.85rem}

@media (max-width:520px){
  body{font-size:16px}
  .day{padding:18px 14px 14px;border-radius:18px}
  .times li{grid-template-columns:34px 6.4em 1fr;gap:2px 10px}
  .ic{width:34px;height:34px}
  .klippen li{grid-template-columns:6.4em 1fr}
  .t{font-size:.88rem}
  .food li{padding-left:0}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
<script src="{{UP}}samtykke.js" data-ga="G-WW4MDXMEJS" defer></script>
</head>
<body data-today="{{TODAY}}" data-tomorrow="{{TOMORROW}}">
<header class="hero">
  <div class="wrap">
    <div class="toprow"><a class="brand" href="{{UP}}">detskeri.dk</a><nav class="langs" aria-label="Sprog / Language">{{LANGS}}</nav></div>
    <h1>{{H1}}</h1>
    <p>{{LEAD}}</p>
    <nav class="guides" aria-label="Bornholm">{{GUIDES}}</nav>
  </div>
  {{TOWN}}
</header>
<nav class="days" aria-label="{{VALGDAG}}"><div class="wrap">{{NAV}}</div></nav>
<div class="wrap">
<main>
{{DAYS}}
</main>
<footer>
  <p class="small">{{SRC}} <a href="https://www.kultunaut.dk/" rel="noopener">KultuNaut</a>. {{UPDATED}} · <a href="#" class="cookie-valg">{{COOKIE}}</a></p>
</footer>
</div>
<script>
/* Holder siden rigtig, selvom den er bygget i nat: skjuler dage der er gået, retter "I dag/I morgen" og toner det, der er slut i dag */
(function(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Copenhagen",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  const today = `${g("year")}-${g("month")}-${g("day")}`, min = (+g("hour") % 24) * 60 + +g("minute");
  const days = [...document.querySelectorAll(".day")];
  let first = null;
  days.forEach(s => { if (s.dataset.date < today) { s.remove(); document.querySelector(`nav.days a[data-date="${s.dataset.date}"]`)?.remove(); } else if (!first) first = s; });
  const rest = [...document.querySelectorAll(".day")];
  rest.forEach((s, i) => {
    const big = s.querySelector(".big"), date = s.querySelector(".date"), nav = document.querySelector(`nav.days a[data-date="${s.dataset.date}"]`);
    if (+big.dataset.rel !== i && i < 2) { if (!date.textContent) date.textContent = big.textContent.toLowerCase(); big.textContent = i ? document.body.dataset.tomorrow : document.body.dataset.today; if (nav) nav.textContent = big.textContent; }
  });
  if (first && first.dataset.date === today) first.querySelectorAll("li[data-end]").forEach(li => {
    const end = +li.dataset.end, t = li.querySelector(".t")?.textContent || "", m = t.match(/^(\d{1,2})(?:\.(\d{2}))?/);
    if (end && end <= min) li.classList.add("past");
    else if (m && (+m[1] * 60 + +(m[2] || 0)) <= min) li.classList.add("now");
  });
  const links = [...document.querySelectorAll("nav.days a")];
  const mark = id => links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + id));
  if (rest[0]) mark(rest[0].id);
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && mark(e.target.id)), { rootMargin: "-40% 0px -55% 0px" });
  [...rest, document.getElementById("senere")].filter(Boolean).forEach(s => io.observe(s));
  document.querySelector('nav.days a[href="#senere"]')?.addEventListener("click", () => { const m = document.querySelector("#senere details"); if (m) m.open = true; });
})();

/* øsiden: vis kun én by ad gangen */
document.querySelectorAll(".tfilter").forEach(f => f.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  f.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  f.nextElementSibling.querySelectorAll("li").forEach(li => li.classList.toggle("hid", !!b.dataset.t && li.dataset.town !== b.dataset.t));
}));
</script>
</body>
</html>
