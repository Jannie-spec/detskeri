<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}} – detskeri.dk</title>
<meta name="description" content="{{LEAD}}">
<link rel="canonical" href="{{CANON}}">
{{HREFLANG}}
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{LEAD}}">
<meta property="og:image" content="https://detskeri.dk/del.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#e5e9e1">
<link rel="icon" href="{{UP}}favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f5f0; --surface:#fff; --sage:#e5e9e1; --mist:#c8d4d0; --moss:#6f806e; --sea:#c6d8d9; --deep:#3f6670;
  --coral:#e37b5b; --brick:#b4533a; --ink:#302f2f; --muted:#5f625e; --line:#dde3d9; --sol:#f2c46b;
  --serif:"Young Serif", Georgia, serif; --sans:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--sans)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hero{background:var(--sage);overflow:hidden}
.hero .wrap{padding-top:34px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 16px}
.brand{font:400 1.05rem/1 var(--serif);color:var(--ink);text-decoration:none}
.langs{display:flex;gap:4px}
.langs a{font-size:.82rem;font-weight:700;text-decoration:none;color:var(--muted);padding:5px 8px;border-radius:999px}
.langs a[aria-current="true"]{background:#fff;color:var(--brick)}
h1{font:400 clamp(2.6rem,10vw,4.6rem)/.95 var(--serif);margin:0;letter-spacing:-.015em}
.hero p{margin:14px 0 0;max-width:30em;color:#4a4d49}
.town{display:block;width:100%;height:auto;margin-top:4px}
main{padding:26px 0 60px}
h2{font:400 1.6rem/1.1 var(--serif);margin:0 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:grid;gap:4px;background:var(--surface);border-radius:18px;padding:18px;text-decoration:none;color:var(--ink);box-shadow:0 1px 0 var(--line)}
.card.big{grid-column:1/-1;background:var(--brick);color:#fff}
.card .cn{font:400 1.3rem/1.15 var(--serif)}
.card.big .cn{font-size:1.8rem}
.card .cc{font-size:.9rem;color:var(--muted)}
.card.big .cc{color:#fbe7df}
.card:hover{outline:2px solid var(--mist)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
</style>
{{NEWSCSS}}
<script src="{{UP}}samtykke.js" data-ga="G-WW4MDXMEJS" defer></script>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="toprow"><span class="brand">detskeri.dk</span><nav class="langs" aria-label="Sprog / Language">{{LANGS}}</nav></div>
    <h1>{{TITLE}}</h1>
    <p>{{LEAD}}</p>
  </div>
  {{TOWN}}
</header>
<div class="wrap"><main>
  <h2>{{H2}}</h2>
  <div class="cards">{{CARDS}}</div>
<div style="margin-top:28px">{{NEWS}}</div>
<p style="margin-top:30px;font-size:.85rem;color:var(--muted)"><a href="{{ADDURL}}" style="color:var(--brick);font-weight:700">{{ADD}}</a> · <a href="#" class="cookie-valg" style="color:inherit">{{COOKIE}}</a></p>
</main></div>
{{NEWSJS}}
</body>
</html>
